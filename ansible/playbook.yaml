- name: Create non-root user and disable root ssh login
  hosts: ungrouped
  remote_user: root # initially, only root exists
  gather_facts: no  # but cannot gather_facts once root ssh login is disabled
  tasks:

    - name: Check non-root user
      ansible.builtin.command: ssh -q -o BatchMode=yes -o ConnectTimeout=3 gatekeeper@{{ inventory_hostname }} "echo OK"
      delegate_to: 127.0.0.1
      changed_when: false # indicates that this task never changes the host
      failed_when: false # indicates that his task can never fail
      register: check_non_root_user

    # Following block is executed as root
    - when: check_non_root_user.rc != 0
      block:
      - name: Create non-root user
        ansible.builtin.user:
          name: gatekeeper
          comment: "Non-root user"
          # generate with `mkpasswd -m yescrypt`
          password: "{{ lookup('ansible.builtin.file', '../secrets/cloudgate/gatekeeper.secret') }}"
          shell: /bin/bash
      - name: Add authorized key
        ansible.posix.authorized_key:
          user: gatekeeper
          key: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') }}"
          exclusive: yes
      - name: Allow sudo for non-root user
        ansible.builtin.copy:
          content: gatekeeper ALL=(ALL) ALL
          dest: /etc/sudoers.d/gatekeeper
          mode: 0600
      - name: Disable Root Login
        ansible.builtin.lineinfile:
          dest: /etc/ssh/sshd_config
          regexp: '^PermitRootLogin'
          line: "PermitRootLogin no"
          state: present
          backup: yes
        notify:
          - Restart ssh

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: sshd
        state: restarted

- name: Install and configure wireguard
  hosts: ungrouped
  remote_user: gatekeeper
  tasks:

    - name: Install wireguard
      become: true
      ansible.builtin.apt:
        name: wireguard
        state: latest
        update_cache: yes

    - name: Create wireguard config
      vars:
        cloudgate_private_key: "{{ lookup('ansible.builtin.file', '../secrets/cloudgate/wireguard/cloudlink.private') }}"
        pi_public_key: "{{ lookup('ansible.builtin.file', '../secrets/pi/wireguard/cloudlink.public') }}"
        pi_cloudgate_psk: "{{ lookup('ansible.builtin.file', '../secrets/cloudgate/wireguard/pi-cloudgate.psk') }}"
      become: true
      ansible.builtin.template:
        dest: /etc/wireguard/wg0.conf
        src: cloudgate_wg0.conf.j2
        owner: root
        group: root
        mode: '0600'

    - name: Start wireguard and enable on boot
      become: true
      ansible.builtin.systemd_service:
        name: wg-quick@wg0
        enabled: yes
        state: started

- name: Install and configure firewall and DNAT
  hosts: ungrouped
  remote_user: gatekeeper
  become: true
  tasks:
    - name: Install nftables
      ansible.builtin.package:
        name: nftables
        state: present

    - name: Start nftables and enable on boot
      ansible.builtin.service:
        name: nftables
        state: started
        enabled: true

    - name: Ensure firewalld is installed
      ansible.builtin.apt:
        name: firewalld
        state: present
        update_cache: yes

    - name: Enable firewalld and enable on boot
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: yes
        state: started
    
    - name: Allow SSH service
      ansible.posix.firewalld:
        zone: public
        service: ssh
        permanent: yes
        immediate: yes
        state: enabled

    - name: Configure firewalld
      ansible.builtin.copy:
        src: files/firewalld/
        dest: /etc/firewalld/
        owner: root
        group: root
        mode: '0644'
        directory_mode: '0750'
        force: yes
      notify: Reload firewalld

  handlers:
    - name: Reload firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: reloaded

